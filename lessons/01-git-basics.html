        <h1>01. Git 與 GitHub 版本控制入門</h1>
        <p class="meta">更新日期：2026-11-16</p>
      </header>

      <section>
        <h2>為什麼需要版本控制？</h2>
        <p>在開發專案時，版本控制可以幫我們記錄每一次的檔案修改，避免改壞程式碼卻無法還原的窘境。</p>
        <blockquote>重點觀念：Commit 就像是遊戲的存檔點，每次完成一個小功能就應該存檔一次。</blockquote>
      </section>

      <section>
        <h2>常用基礎指令</h2>
        <p>將本地端修改推送到 GitHub 的標準流程如下：</p>
        <pre><code>git add .
git commit -m "新增第一篇筆記頁面"
git push origin main</code></pre>
      </section>
    </article>
